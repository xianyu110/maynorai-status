status-website:
  cname: status.maynorai.top
  apiBaseUrl: https://status-api.maynorai.top
  productionCacheTime: 3600000
  localhostCacheTime: 60000
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: momoAI Status
  introTitle: "momoAI 服务状态"
  introMessage: "公开展示 momoAI 导航页收录的 Codex、ChatGPT、Gemini、Grok、Claude、API、AI 应用与资讯站点可用性。状态数据由 GitHub Actions 自动探测并提交，故障记录可追溯。"
  navbar:
    - title: 状态
      href: /
    - title: 永久导航页
      href: https://link3.cc/maynorai
    - title: GitHub
      href: https://github.com/xianyu110/maynorai-status
  js: |
    (function () {
      if (window.location.pathname === "/error") {
        try {
          window.localStorage.removeItem("personal-access-token");
        } catch (error) {}
        window.location.replace("/");
      }
    })();

